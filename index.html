<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巧克力杯子蛋糕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* VOICE: 手绘食谱卡，轻松可爱但留白克制
   IDEA: 速写本里的一页：左边杯子在变化，右边卡片逐个念出食材
   PICTURE: 抖动线条的杯子、掉落的食材、搅拌勺、微波炉、空气炸锅热浪
   COLOUR and TYPE: 奶油底、草莓粉、珊瑚杯、巧克力棕；站酷快乐体做标题和动词
   LAYOUT: 标题 → 场景 + 卡片（窄屏上下叠）→ 步骤条 → 控制 */
:root{color-scheme:light dark;
--bg:light-dark(#FFF8F0,#2A1B14);--card:light-dark(#FFFFFF,#36241B);
--ink:light-dark(#3B2418,#FCEBDD);--soft:light-dark(#8A6A58,#C9AE9C);
--line:light-dark(#E7D8C9,#523A2D);--pink:#E0607E;--pinkL:light-dark(#F9D3DD,#6A3044);
--cup:#F0997B;--cupL:#F5C4B3;--b1:#F6DFA8;--b2:#7A4A32;--choc:#3B2418}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow-x:clip}
.wrap{max-width:920px;margin:0 auto;padding:clamp(22px,4vw,48px) max(4vw,16px) 28px}
.disp{font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;color:var(--pink);-webkit-text-stroke:1.6px var(--choc);paint-order:stroke fill;text-shadow:3px 3px 0 var(--choc);letter-spacing:.02em}
h1{margin:0;text-align:center;font-size:clamp(32px,7vw,50px);line-height:1.1}
.tag{text-align:center;color:var(--soft);font-size:18px;margin-top:10px}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(12px,3vw,36px);align-items:center;margin-top:clamp(14px,3vw,30px)}
.scene{display:block;width:100%;height:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card{position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;background:var(--card);border:2.5px solid var(--choc);border-radius:12px;padding:18px 34px 16px;box-shadow:6px 6px 0 var(--pinkL);min-height:220px}
.card .nav{position:absolute;top:0;bottom:0;width:30px;display:grid;place-items:center;font-size:26px;color:var(--soft);transition:background .2s,color .2s}
.card .nl{left:0;border-radius:10px 0 0 10px}.card .nr{right:0;border-radius:0 10px 10px 0}
.card .nav.hit{background:var(--pinkL);color:var(--pink)}
.kick{font-size:13px;color:var(--pink);font-weight:600}
.verb{font-size:clamp(44px,10vw,58px);line-height:1.1;margin:0 0 2px}
.item{font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-size:clamp(30px,7.5vw,36px);line-height:1.25;margin-top:4px}
.item .amt{color:var(--pink);white-space:nowrap;margin-left:.3em}
.detail{font-size:20px;color:var(--soft);margin-top:6px}.detail:empty{display:none}
.prog{display:flex;align-items:center;gap:10px;margin-top:14px}
.track{flex:1;height:10px;border:2px solid var(--choc);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--pink);transition:width .5s}
.prog span{font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip{margin-top:8px;font-size:18px;line-height:1.5;color:var(--soft)}
.tip:empty{display:none}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.steps{list-style:none;padding:0;margin:clamp(24px,4vw,40px) 0 0;display:flex;justify-content:space-between;position:relative}
.steps::before{content:"";position:absolute;left:6%;right:6%;top:19px;height:2px;background:var(--line)}
.steps li{position:relative;flex:1;text-align:center}
.steps button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;font-size:16px;color:var(--soft);min-height:44px}
.steps b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-family:"ZCOOL KuaiLe",sans-serif;font-size:18px;font-weight:400;transition:.3s}
.steps .done b{border-color:var(--choc);color:var(--ink)}
.steps .on button{color:var(--pink)}
.steps .on b{border-color:var(--choc);background:var(--pink);color:#fff;transform:scale(1.1)}
.steps button:focus-visible b{outline:3px solid var(--pink);outline-offset:2px}
.ctl{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:22px}
.tagrow{position:relative;display:flex;justify-content:center;align-items:center;min-height:44px}.cl-link.home-link{right:auto;left:0;padding:0 12px 0 2px}
.cl-link{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;min-height:44px;padding:0 2px 0 12px;color:var(--pink);font-size:18px;font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent}.cl-link[hidden]{display:none}.cl-link:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}
.pill{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:999px;border:2px solid var(--choc);background:var(--card);color:var(--ink);text-decoration:none;font-size:18px;box-shadow:3px 3px 0 var(--pinkL)}
.pill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pinkL)}
.pill:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#checklist{max-width:620px;margin:20px auto 0}
.srv{margin-top:20px;padding:14px 16px 12px;background:var(--card);border:2.5px solid var(--choc);border-radius:12px;box-shadow:6px 6px 0 var(--pinkL)}
.srv-top{display:flex;justify-content:space-between;align-items:baseline}
.srv-l{font-family:"ZCOOL KuaiLe",sans-serif;font-size:24px;white-space:nowrap}
#nOut{font-family:"ZCOOL KuaiLe",sans-serif;font-size:34px;color:var(--pink)}#nOut::after{content:" " attr(data-u);font-size:20px;color:var(--ink)}
.cups{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;outline:none;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;margin-top:8px;touch-action:none;cursor:pointer;padding:6px 0;border-radius:10px;user-select:none;-webkit-user-select:none}
.cups:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.cups *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.cups svg{display:block;width:100%;height:auto;pointer-events:none}
.cups .c path.body{fill:var(--bg);transition:fill .15s}.cups .c.on path.body{fill:var(--b2)}
.cups .c text{font-size:13px;fill:var(--soft)}.cups .c.on text{fill:var(--ink);font-weight:700}
.srv-h{margin:10px 2px 0;color:var(--soft);font-size:17px}
.cl-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:22px}
#checklist h2{margin:0;font-size:34px}#checklist h2.sm{font-size:28px;margin-top:30px}
#cnt{font-size:18px;color:var(--soft);white-space:nowrap}
.cl{list-style:none;margin:12px 0 0;padding:0;background:var(--card);border:2.5px solid var(--choc);border-radius:12px;box-shadow:6px 6px 0 var(--pinkL);overflow:hidden}
.cl li+li{border-top:1.5px dashed var(--line)}
.cl label{display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:60px;cursor:pointer;font-size:21px}
.cl input{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:30px;margin:0;border:2.5px solid var(--choc);border-radius:8px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.cl input:checked{background:#639922}
.cl input:checked::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3.5px 3.5px 0;transform:translateY(-2px) rotate(45deg)}
.cl input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.cl .nm{flex:1}.cl .am{color:var(--pink);font-weight:700;white-space:nowrap}
.cl li.ok .nm,.cl li.ok .am{color:var(--soft);text-decoration:line-through}
.notes{margin:12px 0 0;padding:16px 18px 16px 44px;background:var(--pinkL);border-radius:12px;font-size:19px;line-height:1.65}
.notes li+li{margin-top:10px}.notes b{color:var(--pink)}
.menu{display:grid;gap:18px;margin:28px auto 0;max-width:560px}
.mcard{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:2.5px solid var(--choc);border-radius:14px;box-shadow:6px 6px 0 var(--pinkL);color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.mcard:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--pinkL)}
.mcard:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.mcard svg{width:78px;flex:none}.mcard>div{flex:1}
.mt{font-family:"ZCOOL KuaiLe",sans-serif;font-size:23px;white-space:nowrap;line-height:1.2}.ms{color:var(--soft);font-size:16px;margin-top:4px}
.ma{font-size:30px;color:var(--pink)}
.more{text-align:center;color:var(--soft);font-size:16px;margin-top:26px}
.cups .ck circle.body{fill:var(--bg);transition:fill .15s}.cups .ck.on circle.body{fill:#D9A15E}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.ctl button{font:inherit;font-size:18px;min-height:44px;min-width:44px;padding:0 18px;border-radius:999px;border:2px solid var(--choc);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--pinkL)}
.ctl button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pinkL)}
.ctl button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#play{background:var(--pink);color:#fff}
@media(max-width:640px){.stage{grid-template-columns:minmax(0,1fr)}.card{min-height:0}.steps span{font-size:15px}.steps b{width:34px;height:34px;font-size:16px}.steps::before{top:17px}}
/* scene */
.cupg,.bat,.dome,.fade{transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .6s,fill .9s}
.bat,.dome{transform-box:fill-box;transform-origin:50% 100%}
.item{transition:opacity .5s}
.egg .ht,.egg .hb{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.egg .shell{opacity:0}.egg.open .whole,.egg.used .whole{opacity:0}.egg.open .shell,.egg.used .shell{opacity:1}
.egg.open .ht{transform:translate(-8px,-14px) rotate(-40deg)}.egg.open .hb{transform:translate(5px,5px) rotate(18deg)}
.egg.used .ht{transform:translate(11px,8px) rotate(180deg)}.egg.used .hb{transform:translate(-10px,2px) rotate(-10deg)}
.item .art{transition:opacity .5s}.item.used:not(.egg) .art{opacity:.4}
.item .chk{opacity:0;transition:opacity .4s}.item.used .chk{opacity:1}
.tag.done{fill:#3B6D11}
.surfg{transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .4s}
#surfE{transition:fill .8s,rx .9s}
.dep{transition:opacity .7s}.dep.gone{opacity:0}
.dep.new{animation:depIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes depIn{from{transform:scale(.2);opacity:0}}
.dep{transform-box:fill-box;transform-origin:50% 100%}
.liq{transform-box:fill-box;transform-origin:50% 0}
.stir{transform-box:view-box;transform-origin:204px 160px;animation:stir 1.1s linear infinite}
@keyframes stir{0%{transform:translate(-22px,0) rotate(-9deg)}12.5%{transform:translate(-15px,4px) rotate(-6deg)}25%{transform:translate(0,6px) rotate(0)}37.5%{transform:translate(15px,4px) rotate(6deg)}50%{transform:translate(22px,0) rotate(9deg)}62.5%{transform:translate(15px,-4px) rotate(6deg)}75%{transform:translate(0,-6px) rotate(0)}87.5%{transform:translate(-15px,-4px) rotate(-6deg)}100%{transform:translate(-22px,0) rotate(-9deg)}}
.ringE{animation:ring 1.1s linear infinite}@keyframes ring{to{stroke-dashoffset:104}}
.bub{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.tag{font-size:17px;font-weight:600;fill:var(--ink);transition:fill .3s}.tag.on{fill:var(--pink);font-weight:800}
.wave{animation:wv 1.4s ease-in-out infinite}
@keyframes wv{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-6px);opacity:1}}
.glow{animation:gl 1.1s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.3}to{opacity:.75}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="wrap">
  <section id="menu" hidden>

    <div class="menu">
      <a class="mcard" href="#cake">
        <svg viewBox="0 0 120 100" aria-hidden="true"><path d="M86 42 Q104 42 102 58 Q100 72 82 70" fill="none" stroke="#3B2418" stroke-width="3"/><path d="M28 38 L88 38 L83 92 Q58 97 33 92 Z" fill="#FDE9DF" stroke="#3B2418" stroke-width="3" stroke-linejoin="round"/><path d="M30 38 Q32 12 58 10 Q84 12 86 38 Z" fill="#7A4A32" stroke="#3B2418" stroke-width="3"/><rect x="48" y="20" width="7" height="7" rx="1.5" fill="#2A170E"/><rect x="64" y="25" width="6" height="6" rx="1.5" fill="#2A170E"/><path d="M44 6 q4 -5 0 -10M70 6 q4 -5 0 -10" stroke="#8A6A58" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>

    <p class="more">更多甜点，敬请期待</p>
  </section>
  <div id="recipe">
  <h1 class="disp" id="rTitle">巧克力杯子蛋糕</h1>
  <div class="tag tagrow"><a class="cl-link home-link" id="homeBtn" href="#">‹ 菜单</a><span id="tagline">1 杯 · 微波炉</span><a class="cl-link topbtn" id="clBtn" href="#cake-list">清单 ›</a></div>
  <div id="anim">

  <div class="stage">
    <svg class="scene" id="scene" viewBox="0 0 420 266" role="img" aria-labelledby="scT">
      <title id="scT">杯子蛋糕制作动画，点击可重播当前动作</title>
      <defs>
        <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
        <clipPath id="bowlClip" clipPathUnits="userSpaceOnUse"><ellipse cx="0" cy="-40" rx="72" ry="13.5"/></clipPath>
        <clipPath id="cupClip" clipPathUnits="userSpaceOnUse"><path d="M-48 -62 L48 -62 L40 58 Q0 66 -40 58 Z"/></clipPath>
        <g id="cupBody">
          <path d="M48 -30 Q76 -28 72 0 Q68 24 42 22" fill="none" stroke="var(--choc)" stroke-width="2.4"/>
          <path d="M-48 -62 L48 -62 L40 58 Q0 66 -40 58 Z" fill="#FDE9DF" stroke="var(--choc)" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M-36 -50 L-31 40" stroke="var(--cup)" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>

      </defs>
      <g filter="url(#rough)">

          <rect x="46" y="100" width="132" height="120" rx="8" fill="none" stroke="var(--choc)" stroke-width="1.8"/>
          <rect x="186" y="104" width="36" height="20" rx="4" fill="var(--choc)"/>
          <text id="timer" x="204" y="118" text-anchor="middle" font-size="12" fill="#FAC775">90</text>
          <circle cx="204" cy="148" r="7" fill="none" stroke="var(--choc)" stroke-width="1.8"/>
          <circle cx="204" cy="172" r="7" fill="none" stroke="var(--choc)" stroke-width="1.8"/>
        </g>

        </g>
        <g class="fade" id="spoon" opacity="0"><g class="stir">
          <path d="M226 30 L204 160" stroke="var(--choc)" stroke-width="7" stroke-linecap="round"/>
          <path d="M226 30 L204 160" stroke="#D3D1C7" stroke-width="3.5" stroke-linecap="round"/>
        </g></g>
        <g id="streams"></g>
        <g transform="translate(30 0)">
        <g class="fade" id="bowlG" opacity="0" transform="translate(170 198)">
          <ellipse cx="0" cy="34" rx="56" ry="6" fill="var(--line)" opacity=".7"/>

          <g clip-path="url(#bowlClip)"><g class="surfg" id="bSurf" opacity="0"><ellipse id="bSurfE" rx="72" ry="13" fill="#F6DFA8" stroke="#D9BE86" stroke-width="1.4"/><g id="bDeps" transform="scale(1.6 1.15)"></g>
            <g class="fade" id="bSwirl" opacity="0"><g transform="scale(1.5 .3)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.1s" repeatCount="indefinite"/><path id="bSwirlP" d="M0 0 m-34 0 a34 34 0 1 1 68 0 a28 28 0 1 1 -56 0 a22 22 0 1 1 44 0 a16 16 0 1 1 -32 0 a10 10 0 1 1 20 0" fill="none" stroke="#D9B46A" stroke-width="5" stroke-linecap="round"/></g></g></g></g></g>
          <path d="M-74 -40 Q-72 34 0 36 Q72 34 74 -40 A74 15 0 0 1 -74 -40 Z" fill="#F7EFE3" stroke="var(--choc)" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M-60 -18 Q-50 14 -24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
          <g fill="#C9B79C"><circle cx="-30" cy="-6" r="2"/><circle cx="10" cy="4" r="2"/><circle cx="40" cy="-10" r="2"/><circle cx="-6" cy="18" r="2"/><circle cx="30" cy="16" r="2"/><circle cx="-48" cy="10" r="2"/></g>
          <g class="fade" id="wrapF" opacity="0"><ellipse cx="0" cy="-42" rx="80" ry="17" fill="#E6F1FB" fill-opacity=".55" stroke="#85B7EB" stroke-width="2"/><path d="M-40 -48 Q-10 -54 20 -50" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>

        <g class="cupg" id="cupA" style="transform:translate(170px,172px)">

          <g clip-path="url(#cupClip)"><rect class="bat" id="batA" x="-55" y="-62" width="110" height="126" fill="var(--b1)" style="transform:scaleY(0)"/>
            <g class="surfg" id="surf" opacity="0"><ellipse id="surfE" rx="44" ry="8" fill="#F6DFA8" stroke="#D9BE86" stroke-width="1.4"/><g id="deps" transform="scale(1.2 1.25)"></g></g>
            <g class="fade" id="swirl" opacity="0"><g id="swirlY"><g transform="scale(1 .3)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.1s" repeatCount="indefinite"/><path id="swirlP" d="M0 0 m-34 0 a34 34 0 1 1 68 0 a28 28 0 1 1 -56 0 a22 22 0 1 1 44 0 a16 16 0 1 1 -32 0 a10 10 0 1 1 20 0" fill="none" stroke="#E2B864" stroke-width="5" stroke-linecap="round"/></g></g></g></g></g>

const VOICE={"打入|鸡蛋":"v01.mp3","倒入|白糖":"v02.mp3","倒入|牛奶":"v03.mp3","搅拌|搅匀":"v04.mp3","倒入|普通面粉":"v05.mp3","倒入|玉米淀粉":"v06.mp3","倒入|无糖可可粉":"v07.mp3","倒入|泡打粉":"v08.mp3","搅拌|拌到没有干粉":"v09.mp3","倒入|巧克力碎块":"v10.mp3","轻拌|稍微拌几下":"v11.mp3","检查|不超过半杯":"v12.mp3","加热|这一杯":"v13.mp3","补时|中心没凝固？":"v14.mp3","烘烤|空气炸锅（可选）":"v15.mp3","完成|开吃！":"v16.mp3","分装|2 个杯子":"v17.mp3","检查|每杯不超过一半":"v18.mp3","加热|每杯单独":"v19.mp3","分装|3 个杯子":"v20.mp3","分装|4 个杯子":"v21.mp3","分装|5 个杯子":"v22.mp3","分装|6 个杯子":"v23.mp3","分装|7 个杯子":"v24.mp3","分装|8 个杯子":"v25.mp3","加入|软化黄油":"v26.mp3","加入|红糖":"v27.mp3","加入|白糖":"v28.mp3","搅拌|1–2 分钟":"v29.mp3","加入|鸡蛋":"v30.mp3","加入|香草精（可选）":"v31.mp3","加入|普通面粉":"v32.mp3","加入|玉米淀粉":"v33.mp3","加入|小苏打":"v34.mp3","加入|盐":"v35.mp3","加入|巧克力碎块":"v36.mp3","冷藏|盖好放冰箱":"v37.mp3","分份|分成 2 份":"v38.mp3","整形|搓圆再压成厚饼":"v39.mp3","预热|空气炸锅 320°F":"v40.mp3","烘烤|间隔摆放":"v41.mp3","出炉|边缘定型、中心略软":"v42.mp3","分份|分成 4 份":"v43.mp3","分份|分成 6 份":"v44.mp3","分份|分成 8 份":"v45.mp3"};
let vNow=null;const vCache={};
function speak(b){
  try{if(vNow){vNow.pause();vNow.currentTime=0}}catch(e){}
  vNow=null;if(!sndOn)return;
  const f=VOICE[b.v+'|'+b.i];if(!f)return;
  const a=vCache[f]||(vCache[f]=new Audio('audio/'+f));
  vNow=a;try{a.currentTime=0}catch(e){}
  const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});
}
function show(i){
  gen++;const g=gen;anims.forEach(a=>a.cancel());anims=[];clearTimeout(nextT);$('streams').innerHTML='';
  cur=Math.max(0,Math.min(B.length-1,i));const b=B[cur],pv=B[cur-1];speak(b);
  const inStep=B.filter(x=>x.s===b.s),k=inStep.indexOf(b)+1;
  $('verb').textContent=b.v;$('item').innerHTML=b.a?`${b.i}<span class="amt">${b.a}</span>`:b.i;$('detail').textContent=b.a?'':b.d;$('tip').textContent=b.t||'';
  $('fill').style.width=(k/inStep.length*100)+'%';$('frac').textContent=`${k} / ${inStep.length}`;
  const c=$('card');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
  [...$('steps').children].forEach((li,j)=>{li.className=j===b.s?'on':j<b.s?'done':''});
  shelf(cur);
  const lv0=b.act?(pv?pv.lv:0):b.lv,c0=b.act?(pv?pv.c:1):b.c;
  (RID==='cake'?scene:cookieScene)(b,lv0,c0);
  if(cur===B.length-1)confetti();
  const run=b.act==='crack'?crack(b,g,lv0):b.act==='pour'?pour(b,g):wait(0);
  run.then(()=>{if(g!==gen||!auto)return;
    nextT=setTimeout(()=>{if(g!==gen||!auto)return;cur<B.length-1?show(cur+1):play(false)},b.act?700:2400)});
  ($('play')||{}).textContent=auto?'暂停':(cur===B.length-1?'重播':'播放');
}
function play(on){
  auto=on;
  if(on){show(cur===B.length-1?0:cur)}else{clearTimeout(nextT)}
  ($('play')||{}).textContent=auto?'暂停':(cur===B.length-1?'重播':'播放');
}
const manual=d=>{auto=false;const n=Math.max(0,Math.min(B.length-1,cur+d));if(n!==cur){ac();sfx('click')}show(n)};
$('steps').onclick=e=>{const t=e.target.closest('button');if(!t)return;auto=false;show(B.findIndex(x=>x.s===+t.dataset.s))};
$('scene').onclick=()=>show(cur);
$('card').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),left=e.clientX<r.left+r.width/2;
  const n=e.currentTarget.querySelector(left?'.nl':'.nr');n.classList.add('hit');setTimeout(()=>n.classList.remove('hit'),220);manual(left?-1:1)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')manual(1);if(e.key==='ArrowLeft')manual(-1);if(e.key===' '){e.preventDefault();play(!auto)}});
const stg=document.querySelector('.stage');
stg.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
stg.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)manual(dx<0?1:-1)});
/* ---------- sound (Web Audio, synthesized) ---------- */
let AC=null,sndOn=true,live=[];
const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC};
const noiseBuf=()=>{const a=AC,b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b};
let NB=null;
function noise(t,dur,{type='bandpass',f=1000,q=1,vol=.3,att=.02,rel=.15,lfo=0,lfoDepth=0}={}){
  const a=AC;NB=NB||noiseBuf();const s=a.createBufferSource();s.buffer=NB;s.loop=true;
  const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0,t+dur);
  s.connect(fl).connect(g).connect(a.destination);
  if(lfo){const o=a.createOscillator(),og=a.createGain();o.frequency.value=lfo;og.gain.value=lfoDepth;o.connect(og).connect(g.gain);o.start(t);o.stop(t+dur);live.push(o)}
  s.start(t);s.stop(t+dur+.05);live.push(s);return fl;
}
function tone(t,f,dur,{type='sine',vol=.2,to=null,keep=false}={}){
  const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);if(!keep)live.push(o);
}
function stopSnd(){live.forEach(n=>{try{n.stop()}catch(e){}});live=[]}
function sfx(k){
  if(k!=='click')return;const a=AC;if(!a||a.state!=='running')return;const t=a.currentTime+.01;
  if(k==='click'){tone(t,880,.06,{type:'triangle',vol:.12,keep:true});return}

}
addEventListener('pointerdown',()=>{ac()},{capture:true});
addEventListener('click',e=>{if(e.target.closest('button,a,#cupBar')&&!e.target.closest('.card')){ac();sfx('click')}});

/* ---------- confetti ---------- */
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function confetti(){
  if(reduce)return;const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio,d=devicePixelRatio;
  const cols=['#E0607E','#F0997B','#FAC775','#85B7EB','#97C459','#7A4A32','#F9D3DD'];
  const burst=(x,y,ang,spread,n,sp)=>{for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*spread,v=(sp*.6+Math.random()*sp)*d;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:(6+Math.random()*6)*d,h:(9+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],round:Math.random()<.25,life:0})}};
  burst(0,H,-Math.PI/3,.7,90,17);burst(W,H,-Math.PI*2/3,.7,90,17);
  setTimeout(()=>burst(W/2,H*.35,-Math.PI/2,Math.PI*2,80,10),350);
  cancelAnimationFrame(raf);
  const step=()=>{cx.clearRect(0,0,W,H);parts=parts.filter(p=>p.y<H+40*d&&p.life<320);
    for(const p of parts){p.life++;p.vy+=.32*d;p.vx*=.99;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.life*.18));cx.fillStyle=p.c;
      if(p.round){cx.beginPath();cx.arc(0,0,p.w/2,0,7);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
    if(parts.length)raf=requestAnimationFrame(step);else cx.clearRect(0,0,W,H)};
  raf=requestAnimationFrame(step);
}

/* ---------- checklist page ---------- */
let ING=[],TOOL=[],ck={};
const loadCk=()=>{ck={};try{ck=JSON.parse(localStorage.getItem(R.ckKey)||'{}')}catch(e){}};
const row=(p,[n,a],k)=>{const id=p+k;return `<li class="${ck[id]?'ok':''}"><label><input type="checkbox" data-id="${id}" ${ck[id]?'checked':''}><span class="nm">${n}</span><span class="am">${a}</span></label></li>`};
function renderCl(){ING=R.ing.map(([n,k])=>[n,amt(k)]);TOOL=R.tools(N);
  $('clIng').innerHTML=ING.map((r,k)=>row('i',r,k)).join('');$('clTool').innerHTML=TOOL.map((r,k)=>row('t',r,k)).join('');
  $('notes').innerHTML=R.notes(N).map(t=>`<li>${t}</li>`).join('');count()}
function count(){const n=ING.filter((_,k)=>ck['i'+k]).length;$('cnt').textContent=`已备好 ${n} / ${ING.length}`}
$('checklist').addEventListener('change',e=>{const c=e.target;if(!c.dataset.id)return;ck[c.dataset.id]=c.checked;c.closest('li').classList.toggle('ok',c.checked);
  try{localStorage.setItem(R.ckKey,JSON.stringify(ck))}catch(err){}count()});
$('clReset').onclick=()=>{ck={};try{localStorage.removeItem(R.ckKey)}catch(e){}renderCl()};
/* ---------- servings bar ---------- */
const bar=$('cupBar');
const CUPI=k=>`<svg class="c" viewBox="0 0 44 60"><path d="M32 18 Q42 18 41 27 Q40 35 31 34" fill="none" stroke="#3B2418" stroke-width="2.4"/><path class="body" d="M5 10 L35 10 L32 44 Q20 47 8 44 Z" stroke="#3B2418" stroke-width="2.4" stroke-linejoin="round"/><text x="20" y="58" text-anchor="middle">${k}</text></svg>`;
const COOKI=k=>`<svg class="c ck" viewBox="0 0 80 60">${[[24,24],[54,28]].map(([x,y])=>`<circle class="body" cx="${x}" cy="${y}" r="16" stroke="#3B2418" stroke-width="2.4"/><rect x="${x-8}" y="${y-7}" width="5" height="5" rx="1.2" fill="#3B2418" opacity=".55"/><rect x="${x+2}" y="${y}" width="5" height="5" rx="1.2" fill="#3B2418" opacity=".55"/>`).join('')}<text x="40" y="58" text-anchor="middle">${k}</text></svg>`;
function buildBar(){bar.style.gridTemplateColumns=`repeat(${R.opts.length},minmax(0,1fr))`;bar.innerHTML=R.opts.map(v=>RID==='cookie'?COOKI(v):CUPI(v)).join('');
  bar.setAttribute('aria-valuemin',R.opts[0]);bar.setAttribute('aria-valuemax',R.opts[R.opts.length-1])}
const paintBar=()=>{[...bar.children].forEach((c,k)=>c.classList.toggle('on',R.opts[k]<=N));bar.setAttribute('aria-valuenow',N);bar.setAttribute('aria-valuetext',N+' '+R.unit)};
function applyN(){build();buildShelf();buildCups();$('rTitle').textContent=R.title;document.title=R.title;
  $('tagline').textContent=R.tagline(N);$('nOut').textContent=N;$('nOut').dataset.u=R.unit;$('srvL').textContent=R.srvL;$('srvH').textContent=R.srvH;
  renderCl();paintBar()}
const setN=v=>{if(!R.opts.includes(v)||v===N)return;N=v;try{localStorage.setItem(R.key,N)}catch(e){}applyN();auto=false;cur=0};
const pick=e=>{const r=bar.getBoundingClientRect(),L=R.opts.length;const i=Math.min(L,Math.max(1,Math.ceil((e.clientX-r.left)/r.width*L)));setN(R.opts[i-1])};
let drag=false;
bar.addEventListener('pointerdown',e=>{drag=true;try{bar.setPointerCapture(e.pointerId)}catch(err){}pick(e)});
bar.addEventListener('contextmenu',e=>e.preventDefault());bar.addEventListener('selectstart',e=>e.preventDefault());
bar.addEventListener('pointermove',e=>{if(drag)pick(e)});
['pointerup','pointercancel'].forEach(t=>bar.addEventListener(t,()=>drag=false));
bar.addEventListener('keydown',e=>{const i=R.opts.indexOf(N);if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();setN(R.opts[Math.min(R.opts.length-1,i+1)])}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();setN(R.opts[Math.max(0,i-1)])}});
/* ---------- routing ---------- */
function stopAnim(){auto=false;clearTimeout(nextT);gen++;anims.forEach(a=>a.cancel());anims=[];clearInterval(tick)}
function switchRecipe(id){RID=id;R=RECIPES[id];N=loadN();loadCk();buildBar();applyN();cur=0;
  $('clBtn').href=`#${id}-list`;document.querySelectorAll('.backAnim').forEach(a=>a.href=`#${id}`)}
let firstView=true;
function route(){
  let h=location.hash.slice(1);if(h==='checklist')h='cake-list';
  if(!h||h==='menu'){stopAnim();$('menu').hidden=false;$('recipe').hidden=true;document.title='甜点菜单';scrollTo(0,0);return}
  const [rid,sub]=h.split('-');if(!RECIPES[rid]){location.hash='';return}
  $('menu').hidden=true;$('recipe').hidden=false;
  let fresh=false;if(rid!==RID||firstView){switchRecipe(rid);fresh=true}
  const on=sub==='list';$('checklist').hidden=!on;$('anim').hidden=on;$('clBtn').hidden=on;$('homeBtn').hidden=on;
  if(on){stopAnim();scrollTo(0,0)}else{if(fresh){auto=!reduce}fitTags();show(cur)}
  firstView=false;
}
addEventListener('hashchange',route);
switchRecipe('cake');route();
}
